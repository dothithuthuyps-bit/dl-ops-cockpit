function vendorStats(db, v) {
  const rs = db.requests.filter(r => r.vendorId === v.id && r.status !== "REJECTED");
  const spend = rs.reduce((a, r) => a + r.amount, 0);
  let flags = 0,
    mism = 0,
    total = 0;
  rs.forEach(r => {
    if (reviewRequest(r, db).verdict === "Flag") flags++;
    if (v.expectedAmount) {
      total++;
      if (Math.abs(r.amount - v.expectedAmount) / v.expectedAmount > 0.15) mism++;
    }
  });
  const matchPct = total ? Math.round((1 - mism / total) * 100) : null;
  let score = 100 - flags * 15 - mism * 10 - (v.expectedAmount ? 0 : 8);
  score = Math.max(0, Math.min(100, score));
  return {
    spend,
    count: rs.length,
    flags,
    matchPct,
    score
  };
}

/* ---------- structured email ---------- */
function emailHtml(db, o) {
  const req = o.req,
    v = req ? db.vendors.find(x => x.id === req.vendorId) : null;
  const cta = db.settings && db.settings.portalUrl || "";
  const row = (k, val) => `<tr><td style="color:#7F7F7F;padding:4px 0;font-size:13px">${k}</td><td style="text-align:right;font-size:13px">${val}</td></tr>`;
  const sect = (t, body) => `<div style="margin:14px 0 0"><div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#191919;font-weight:700">${t}</div><div style="font-size:14px;color:#4C4C4C;margin-top:3px;line-height:1.5">${body}</div></div>`;
  const details = req ? `<table style="width:100%;border-collapse:collapse;margin-top:10px">${row("Payee", v ? v.name : "—")}${row("Amount", "<b>" + money(req.amount) + "</b>")}${row("Category", req.category)}${row("Cost centre", req.dept)}${row("Due", fmtDate(req.dueDate))}</table>` : "";
  const button = `<a href="${cta || "#"}" style="display:inline-block;margin-top:16px;background:#000000;color:#fff;text-decoration:none;font-size:14px;font-weight:600;padding:11px 20px;border-radius:999px">Open portal &amp; take action &rarr;</a>`;
  return `<div style="font-family:Helvetica,Arial,sans-serif;max-width:540px;margin:0 auto;border:1px solid #E5E5E5;border-radius:14px;overflow:hidden;background:#fff">` + `<div style="height:6px;background:linear-gradient(115deg,#28AAF0,#00E5E5 50%,#00DC82)"></div>` + `<div style="padding:22px">` + `<div style="font-weight:800;font-size:12px;letter-spacing:1.5px;color:#191919">DECISION LAB &middot; PAYMENTS</div>` + `<h2 style="margin:8px 0 2px;font-size:19px;color:#191919">${o.heading}</h2>` + details + sect("The situation", o.situation) + sect("Action needed", o.action) + sect("Recommendation", o.rec) + button + `<p style="font-size:11px;color:#B2B2B2;margin-top:16px">Automated by the Payments Control Portal.</p>` + `</div></div>`;
}
function enqueueEmail(next, e) {
  const on = next.settings && next.settings.emailEnabled && next.settings.webhookUrl;
  const to = (e.to || []).filter(Boolean);
  const id = uid("mail");
  next.outbox.unshift({
    id,
    ts: Date.now(),
    to,
    subject: e.subject,
    html: e.html,
    event: e.event,
    requestId: e.requestId || null,
    status: on ? "queued" : "logged",
    payload: {
      event: e.event,
      to: to,
      toText: to.join(", "),
      subject: e.subject,
      html: e.html,
      requestId: e.requestId || null
    }
  });
}

      style: { fontWeight: 800 }
    }, props.v),
    E("div", { className: "text-[11px] text-neutral-400 mt-0.5" }, props.s)
  );

  const industryRows = industry.map(i => ({
    industry: i.industry,
    actual: i.actualFy2627,
    target: targetForSegment(i.segment)
  }));
  const companyActual = industryRows.reduce((s, r) => s + r.actual, 0);
  const companyTarget = companyTotal;

  const SectionLabel = (t) => E("div", {
    className: "text-[11px] uppercase tracking-widest text-neutral-400 mb-2 font-medium"
  }, t);

  const BarCell = (pct) => E("div", { className: "h-2 rounded-full bg-neutral-100 overflow-hidden" },
    E("div", {
      className: "h-full rounded-full",
      style: { width: (Math.min(pct, 1) * 100) + "%", background: "#1D7AAD" }
    })
  );

  /* ---- KPI band ---- */
  const kpiBand = kpi ? E("div", { className: "grid grid-cols-2 lg:grid-cols-4 gap-4" },
    E(Kpi, { l: "Total revenue (5FY)", v: money(kpi.totalRevenue5fy), s: kpi.asOfLabel }),
    E(Kpi, { l: "FY26/27 revenue", v: money(kpi.revenueFy2627), s: "vs " + money(kpi.revenueFy2526) + " FY25/26" }),
    E(Kpi, {
      l: "YoY growth",
      v: (kpi.growthPct >= 0 ? "+" : "") + kpi.growthPct.toFixed(1) + "%",
      s: "FY26/27 vs FY25/26",
      flag: kpi.growthPct < 0 ? "bad" : "good"
    }),
    E(Kpi, { l: "Projects (5FY)", v: kpi.totalProjects5fy, s: "active projects, all years" }),
    E(Kpi, { l: "FY26/27 target", v: money(companyTarget), s: "live — sum of Budget table below" }),
    E(Kpi, {
      l: "% of target",
      v: companyTarget ? (pctOf(kpi.revenueFy2627, companyTarget) * 100).toFixed(1) + "%" : "—",
      s: "FY26/27 revenue vs target",
      flag: pctOf(kpi.revenueFy2627, companyTarget) < 0.8 ? "bad" : "good"
    }),
    E(Kpi, {
      l: "Company total (YTD FY26/27)",
      v: money(companyActual),
      s: companyTarget ? (pctOf(companyActual, companyTarget) * 100).toFixed(1) + "% of target" : "—",
      flag: pctOf(companyActual, companyTarget) < 0.8 ? "bad" : "good"
    })
  ) : null;

  /* ---- Chart row 1 ---- */
  const chartRow1 = E("div", { className: "grid lg:grid-cols-2 gap-5" },
    E(Card, { className: "p-5" },
      E("div", { className: "font-display text-sm uppercase tracking-wide mb-3", style: { fontWeight: 700 } }, "Revenue by fiscal year (last 5FY)"),
      E(ChartBox, {
        type: "bar",
        data: {
          labels: byFy.map(f => f.fiscalYear),
          datasets: [{ label: "Revenue", data: byFy.map(f => f.revenue), backgroundColor: "#1D7AAD", borderRadius: 4 }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: { y: { ticks: { callback: v => "$" + (v / 1000).toFixed(0) + "K" } } }
        }
      })
    ),
    E(Card, { className: "p-5" },
      E("div", { className: "font-display text-sm uppercase tracking-wide mb-3", style: { fontWeight: 700 } }, "Revenue by product type (FY26/27)"),
      E(ChartBox, {
        type: "doughnut",
        data: {
          labels: prodType.map(p => p.productType),
          datasets: [{ data: prodType.map(p => p.revenueFy2627), backgroundColor: prodType.map(p => SALES_CATEGORY_COLOR[p.productType] || "#999") }]
        },
        options: { plugins: { legend: { position: "bottom" } } }
      })
    )
  );

  /* ---- Chart row 2 ---- */
  const chartRow2 = E("div", { className: "grid lg:grid-cols-2 gap-5" },
    E(Card, { className: "p-5" },
      E("div", { className: "font-display text-sm uppercase tracking-wide mb-3", style: { fontWeight: 700 } }, "Top 10 clients by revenue (FY26/27)"),
      E(ChartBox, {
        type: "bar",
        data: {
          labels: clients.map(c => c.client),
          datasets: [{ label: "FY26/27 revenue", data: clients.map(c => c.revenueFy2627), backgroundColor: "#00A5A5", borderRadius: 4 }]
        },
        options: {
          indexAxis: "y",
          plugins: { legend: { display: false } },
          scales: { x: { ticks: { callback: v => "$" + (v / 1000).toFixed(0) + "K" } } }
        },
        height: 300
      })
    ),
    E(Card, { className: "p-5" },
      E("div", { className: "font-display text-sm uppercase tracking-wide mb-3", style: { fontWeight: 700 } }, "FY26/27 revenue by industry: actual vs target"),
      E(ChartBox, {
        type: "bar",
        data: {
          labels: industryRows.map(r => r.industry).concat(["Company Total"]),
          datasets: [
            { label: "Actual", data: industryRows.map(r => r.actual).concat([companyActual]), backgroundColor: "#17638B", borderRadius: 4 },
            { label: "Target", data: industryRows.map(r => r.target).concat([companyTarget]), backgroundColor: "#F9C37A", borderRadius: 4 }
          ]
        },
        options: { scales: { y: { ticks: { callback: v => "$" + (v / 1000).toFixed(0) + "K" } } } },
        height: 300
      })
    )
  );

  /* ---- Industry table ---- */
  const industryDataRows = industryRows.map(r => E("tr", { key: r.industry },
    E("td", { className: "px-4 py-2.5 text-neutral-700" }, r.industry),
    E("td", { className: "px-4 py-2.5 text-right text-neutral-900" }, money(r.actual)),
    E("td", { className: "px-4 py-2.5 text-right text-neutral-500" }, money(r.target)),
    E("td", { className: "px-4 py-2.5 text-right font-semibold " + (pctOf(r.actual, r.target) < 0.8 ? "text-rose-600" : "text-emerald-600") },
      r.target ? (pctOf(r.actual, r.target) * 100).toFixed(1) + "%" : "—"),
    E("td", { className: "px-4 py-2.5" }, BarCell(pctOf(r.actual, r.target)))
  ));
  const industryTotalRow = E("tr", { key: "company_total", className: "bg-neutral-50/70 font-semibold" },
    E("td", { className: "px-4 py-2.5 text-neutral-900" }, "Company Total"),
    E("td", { className: "px-4 py-2.5 text-right text-neutral-900" }, money(companyActual)),
    E("td", { className: "px-4 py-2.5 text-right text-neutral-700" }, money(companyTarget)),
    E("td", { className: "px-4 py-2.5 text-right " + (pctOf(companyActual, companyTarget) < 0.8 ? "text-rose-600" : "text-emerald-600") },
      companyTarget ? (pctOf(companyActual, companyTarget) * 100).toFixed(1) + "%" : "—"),
    E("td", { className: "px-4 py-2.5" }, BarCell(pctOf(companyActual, companyTarget)))
  );
  const industryTable = E(Card, { className: "overflow-hidden" },
    E("div", { className: "px-5 py-3 border-b border-neutral-100 font-display text-sm uppercase tracking-wide", style: { fontWeight: 700 } },
      "FY26/27 revenue by industry — actual vs target"),
    E("table", { className: "w-full text-sm" },
      E("thead", null, E("tr", { className: "text-left text-[11px] uppercase tracking-wide text-neutral-400 border-b border-neutral-100 bg-neutral-50/70" },
        E("th", { className: "px-4 py-2.5 font-medium" }, "Industry"),
        E("th", { className: "px-4 py-2.5 font-medium text-right" }, "Actual FY26/27"),
        E("th", { className: "px-4 py-2.5 font-medium text-right" }, "Target FY26/27"),
        E("th", { className: "px-4 py-2.5 font-medium text-right" }, "% of target"),
        E("th", { className: "px-4 py-2.5 font-medium w-40" }, "")
      )),
      E("tbody", { className: "divide-y divide-neutral-50" }, industryDataRows.concat([industryTotalRow]))
    )
  );

  /* ---- Top 10 clients table ---- */
  const clientRows = clients.map(c => E("tr", { key: c.id, className: "hover:bg-neutral-50/60" },
    E("td", { className: "px-4 py-2.5 text-neutral-400" }, c.rank),
    E("td", { className: "px-4 py-2.5 font-medium text-neutral-900" }, c.client),
    E("td", { className: "px-4 py-2.5 text-right text-neutral-500" }, money(c.totalRevenue5fy)),
    E("td", { className: "px-4 py-2.5 text-right text-neutral-900" }, money(c.revenueFy2627))
  ));
  const clientsTable = E(Card, { className: "overflow-hidden" },
    E("div", { className: "px-5 py-3 border-b border-neutral-100 font-display text-sm uppercase tracking-wide", style: { fontWeight: 700 } },
      "Top 10 clients by revenue (FY26/27)"),
    E("table", { className: "w-full text-sm" },
      E("thead", null, E("tr", { className: "text-left text-[11px] uppercase tracking-wide text-neutral-400 border-b border-neutral-100 bg-neutral-50/70" },
        E("th", { className: "px-4 py-2.5 font-medium" }, "Rank"),
        E("th", { className: "px-4 py-2.5 font-medium" }, "Client"),
        E("th", { className: "px-4 py-2.5 font-medium text-right" }, "Total revenue (5FY)"),
        E("th", { className: "px-4 py-2.5 font-medium text-right" }, "FY26/27 revenue")
      )),
      E("tbody", { className: "divide-y divide-neutral-50" }, clientRows)
    )
  );

  /* ---- Budget table ---- */
  const budgetHeaderCells = [E("th", { key: "lbl", className: "px-3 py-2 font-medium sticky left-0 bg-neutral-50/70 min-w-[140px]" }, "")]
    .concat(SALES_MONTH_LABELS.map(m => E("th", { key: m, className: "px-3 py-2 font-medium text-right min-w-[90px]" }, m)))
    .concat([E("th", { key: "tot", className: "px-3 py-2 font-medium text-right min-w-[100px]" }, "Total")]);

  const buildSegmentRows = (seg) => {
    const headerRow = E("tr", { key: seg + "_hdr" },
      E("td", { className: "px-3 py-1.5 font-semibold text-white sticky left-0", style: { background: SALES_SEGMENT_COLOR[seg] } }, seg),
      ...SALES_MONTHS.map(m => E("td", { key: m, className: "px-3 py-1.5", style: { background: SALES_SEGMENT_COLOR[seg] } })),
      E("td", { className: "px-3 py-1.5", style: { background: SALES_SEGMENT_COLOR[seg] } })
    );
    const revenueRow = E("tr", { key: seg + "_rev", className: "font-semibold bg-neutral-50/50" },
      E("td", { className: "px-3 py-1.5 sticky left-0 bg-neutral-50/50" }, "Revenue"),
      ...SALES_MONTHS.map(m => E("td", { key: m, className: "px-3 py-1.5 text-right" }, money(segmentMonthTotal(seg, m)))),
      E("td", { className: "px-3 py-1.5 text-right" }, money(segmentTotal(seg)))
    );
    const catRows = SALES_CATEGORIES.map(cat => E("tr", { key: seg + "_" + cat, className: "hover:bg-neutral-50/60" },
      E("td", { className: "px-3 py-1.5 text-neutral-500 sticky left-0 bg-white" }, cat),
      ...SALES_MONTHS.map(m => {
        const cur = amountFor(seg, m, cat);
        return E("td", { key: m, className: "px-1 py-1 text-right" },
          editable
            ? E("input", {
                type: "number",
                step: "0.01",
                defaultValue: Math.round(cur * 100) / 100,
                onBlur: (e) => {
                  const v = Number(e.target.value) || 0;
                  if (v !== cur) saveCell(seg, m, cat, v);
                },
                className: "w-20 text-right text-[11px] bg-transparent border-0 border-b border-dashed border-neutral-200 focus:outline-none focus:border-neutral-400 px-1 py-0.5"
              })
            : money(cur)
        );
      }),
      E("td", { className: "px-3 py-1.5 text-right text-neutral-400" }, "—")
    ));
    return [headerRow, revenueRow].concat(catRows);
  };

  let bodyRows = [];
  SALES_SEGMENTS.forEach(seg => { bodyRows = bodyRows.concat(buildSegmentRows(seg)); });
  const companyRow = E("tr", { key: "company_total", className: "font-bold bg-neutral-900 text-white" },
    E("td", { className: "px-3 py-2 sticky left-0 bg-neutral-900" }, "Company Total"),
    ...SALES_MONTHS.map(m => E("td", { key: m, className: "px-3 py-2 text-right" }, money(companyMonthTotal(m)))),
    E("td", { className: "px-3 py-2 text-right" }, money(companyTotal))
  );
  bodyRows.push(companyRow);

  const budgetTable = E(Card, { className: "overflow-hidden" },
    E("div", { className: "px-5 py-3 border-b border-neutral-100 flex items-center justify-between" },
      E("div", { className: "font-display text-sm uppercase tracking-wide", style: { fontWeight: 700 } }, "Budget — FY26/27 (by segment, live)"),
      E("div", { className: "text-[11px] text-neutral-400" }, editable ? "Editable — changes save automatically and sync to Supabase" : "Read-only for your role")
    ),
    E("div", { className: "overflow-x-auto" },
      E("table", { className: "text-xs", style: { minWidth: 1400 } },
        E("thead", null, E("tr", { className: "text-left text-[10px] uppercase tracking-wide text-neutral-400 border-b border-neutral-100 bg-neutral-50/70" }, budgetHeaderCells)),
        E("tbody", { className: "divide-y divide-neutral-50" }, bodyRows)
      )
    ),
    E("div", { className: "px-5 py-2.5 text-[11px] text-neutral-400 border-t border-neutral-100" },
      "Revenue and Company Total rows are computed live from the category rows above. This table now replaces the \"Sales target\" Excel sheet as the source of truth — the FY26/27 Target KPI and industry Target column above read directly from it.")
  );

  return E("div", { className: "space-y-5 max-w-6xl" },
    E("div", null, SectionLabel("Company sales performance overview — source: Revenue.xlsx, imported 26 Aug 2026"), kpiBand),
    chartRow1,
    chartRow2,
    industryTable,
    clientsTable,
    budgetTable
  );
}

/* ================= Financial Health (company-wide Budget/Target + Sales Performance) =================
   Budget/Target seeded from the "Budget FY26/27" deck slide (Direct Cost / Practice Cost /
   Opex+Personnel / Ebitda stacked by quarter, FY25/26 through FY26/27). Company-wide, source of
   truth is company_budget_quarters (editable, admin/ceo/finance_director). "Total" per quarter =
   Direct Cost + Practice Cost + Opex+Personnel + Ebitda (i.e. total revenue for that quarter). */
const FINHEALTH_COST_FIELDS = [
  { key: "directCost", label: "Direct Cost", color: "#17638B" },
  { key: "practiceCost", label: "Practice Cost", color: "#2396D3" },
  { key: "opexPersonnel", label: "Opex + Personnel", color: "#64C2F4" },
  { key: "ebitda", label: "Ebitda", color: "#BAE4FA" }
];
const fhQuarterLabel = (r) => `${r.quarter} ${r.fiscalYear}`;
const fhTotal = (r) => Number(r.directCost || 0) + Number(r.practiceCost || 0) + Number(r.opexPersonnel || 0) + Number(r.ebitda || 0);
const fhMoney = (n) => Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 0 });
const fhPct = (n) => n == null ? "—" : `${n >= 0 ? "+" : ""}${n.toFixed(1)}%`;

function CompanyBudgetTargetV({ db, update, role }) {
  const E = React.createElement;
  const editable = ["admin", "ceo", "finance_director"].includes(role);
  const rows = (db.companyBudgetQuarters || []).slice().sort((a, b) => a.sortOrder - b.sortOrder);

  const fy2526Rows = rows.filter(r => r.fiscalYear === "FY25/26");
  const fy2627Rows = rows.filter(r => r.fiscalYear === "FY26/27");
  const sumTotal = (list) => list.reduce((s, r) => s + fhTotal(r), 0);
  const sumField = (list, key) => list.reduce((s, r) => s + Number(r[key] || 0), 0);
  const fy2526Total = sumTotal(fy2526Rows);
  const fy2627Total = sumTotal(fy2627Rows);
  const yoyGrowth = fy2526Total > 0 ? ((fy2627Total - fy2526Total) / fy2526Total) * 100 : null;
  const fy2627Ebitda = sumField(fy2627Rows, "ebitda");
  const ebitdaMargin = fy2627Total > 0 ? (fy2627Ebitda / fy2627Total) * 100 : null;

  const kpiCells = [
    { l: "FY25/26 total", v: fhMoney(fy2526Total) },
    { l: "FY26/27 total (budget)", v: fhMoney(fy2627Total) },
    { l: "YoY growth", v: fhPct(yoyGrowth), flag: yoyGrowth != null && yoyGrowth < 0 ? "bad" : "good" },
    { l: "FY26/27 EBITDA margin", v: ebitdaMargin == null ? "—" : `${ebitdaMargin.toFixed(1)}%` }
  ];

  const chartLabels = rows.map(fhQuarterLabel);
  const chartDatasets = FINHEALTH_COST_FIELDS.map(f => ({
    label: f.label,
    data: rows.map(r => Number(r[f.key] || 0)),
    backgroundColor: f.color
  }));
  const chartData = { labels: chartLabels, datasets: chartDatasets };
  const chartOptions = {
    scales: {
      x: { stacked: true },
      y: { stacked: true, ticks: { callback: (v) => fhMoney(v) } }
    },
    plugins: { legend: { position: "bottom" } }
  };

  const growthStrip = E("div", { className: "flex items-center gap-1 overflow-x-auto pb-1" },
    rows.map((r, i) => {
      const prev = rows[i - 1];
      const growth = prev ? ((fhTotal(r) - fhTotal(prev)) / (fhTotal(prev) || 1)) * 100 : null;
      return E("div", { key: r.id, className: "flex-1 min-w-[90px] text-center bg-neutral-50 rounded-lg py-2" },
        E("div", { className: "text-[10px] text-neutral-400" }, fhQuarterLabel(r)),
        E("div", { className: "text-[12px] font-semibold text-neutral-800" }, fhMoney(fhTotal(r))),
        E("div", { className: `text-[10px] font-medium ${growth == null ? "text-neutral-300" : growth >= 0 ? "text-emerald-600" : "text-rose-600"}` }, growth == null ? "—" : fhPct(growth))
      );
    })
  );

  const saveCell = (id, key, value) => update(next => {
    const arr = next.companyBudgetQuarters || (next.companyBudgetQuarters = []);
    const row = arr.find(r => r.id === id);
    if (row) row[key] = value;
  });

  const tableHeaderCells = [E("th", { key: "q", className: "px-4 py-2.5 font-medium text-left" }, "Quarter")]
    .concat(FINHEALTH_COST_FIELDS.map(f => E("th", { key: f.key, className: "px-4 py-2.5 font-medium text-right" }, f.label)))
    .concat([E("th", { key: "total", className: "px-4 py-2.5 font-medium text-right" }, "Total")]);

  const tableBodyRows = rows.map(r => {
    const cells = [E("td", { key: "q", className: "px-4 py-2.5 font-medium text-neutral-700 whitespace-nowrap" }, fhQuarterLabel(r))];
    FINHEALTH_COST_FIELDS.forEach(f => {
      cells.push(E("td", { key: f.key, className: "px-4 py-1.5 text-right" },
        editable
          ? E("input", {
              type: "number", value: r[f.key] == null ? "" : r[f.key],
              onChange: (e) => saveCell(r.id, f.key, e.target.value === "" ? 0 : Number(e.target.value)),
              className: "w-28 text-right text-sm border border-neutral-200 rounded-lg px-2 py-1"
            })
          : fhMoney(r[f.key])
      ));
    });
    cells.push(E("td", { key: "total", className: "px-4 py-2.5 text-right font-semibold text-neutral-900" }, fhMoney(fhTotal(r))));
    return E("tr", { key: r.id, className: "hover:bg-neutral-50/60" }, cells);
  });

  return E("div", { className: "space-y-4" },
    E("div", { className: "grid grid-cols-2 md:grid-cols-4 gap-3" },
      kpiCells.map((k, i) => E(Card, { key: i, className: "p-4" },
        E("div", { className: "text-[10px] uppercase text-neutral-400" }, k.l),
        E("div", { className: `text-xl font-bold ${k.flag === "bad" ? "text-rose-600" : k.flag === "good" ? "text-emerald-600" : "text-neutral-900"}` }, k.v)
      ))
    ),
    E(Card, { className: "p-4" },
      E("div", { className: "text-[11px] uppercase tracking-wide text-neutral-400 mb-2" }, "Budget by quarter"),
      E(ChartBox, { type: "bar", data: chartData, options: chartOptions, height: 320 })
    ),
    E(Card, { className: "p-3" },
      E("div", { className: "text-[11px] uppercase tracking-wide text-neutral-400 mb-2 px-1" }, "Quarter-over-quarter growth (total)"),
      growthStrip
    ),
    E(Card, { className: "overflow-hidden" },
      E("div", { className: "px-4 py-2.5 border-b border-neutral-100 flex items-center justify-between" },
        E("div", { className: "text-[11px] uppercase tracking-wide text-neutral-400" }, "Company budget — editable"),
        !editable ? E("div", { className: "text-[11px] text-neutral-400" }, "View only for your role") : null
      ),
      E("div", { className: "overflow-x-auto" },
        E("table", { className: "w-full text-sm" },
          E("thead", null, E("tr", { className: "text-left text-[11px] uppercase tracking-wide text-neutral-400 border-b border-neutral-100 bg-neutral-50/70" }, tableHeaderCells)),
          E("tbody", { className: "divide-y divide-neutral-50" }, tableBodyRows)
        )
      )
    )
  );
}

function FinancialHealthV({ db, update, role }) {
  const E = React.createElement;
  const [sub, setSub] = useState("budget");
  const tabs = [["budget", "Budget & Target"], ["salesperf", "Sales Performance"]];
  return E("div", { className: "space-y-4 max-w-6xl" },
    E("div", { className: "flex items-center gap-1 flex-wrap" },
      tabs.map(([k, l]) => E("button", {
        key: k, onClick: () => setSub(k),
        className: `text-sm px-4 py-2 rounded-full ${sub === k ? "bg-neutral-900 text-white" : "bg-white text-neutral-600 ring-1 ring-neutral-200 hover:bg-neutral-50"}`
      }, l))
    ),
    sub === "budget" ? E(CompanyBudgetTargetV, { db, update, role }) : E(SalesPerformanceV, { db, update, role })
  );
}


/* ================= Employee Data Hub (EDD journey + documents) =================
   Source: "2026.8 EDD Form.docx" (Decision Lab Employee Development Dialogue), imported 2026-08-27.
   One form, two seasons: Summer = compensation/performance (sections 7-8 active), Winter =
   career planning (sections 4-6 go deep). Confidential to employee + line manager + HR. */
const EDD_COMPETENCIES = [
  {
    key: "rigorous", name: "Rigorous", sub: "Evidence and method quality", craft: false,
    items: [
      "Research design meets agreed methodological and ethical standards before fieldwork starts",

      "Every conclusion can be traced back to specific evidence, not assumption"
    ],
    anchors: { 1: "Design / analysis errors go unchecked; conclusions often unsupported", 3: "Standards generally met; occasional gaps in validation or traceability", 5: "Consistently rigorous; zero unchecked errors; every conclusion is evidence-backed" }
  },
  {
    key: "truth_seeking", name: "Truth-seeking", sub: "Clear, direct, honest insight", craft: false,
    items: [
      "Insight is written in plain, direct language — no jargon, no hedging",
      "Limitations or gaps in the data are stated explicitly, not glossed over",
      "Output always ends in a clear conclusion or recommendation, not just observations"
    ],
    anchors: { 1: "Vague, hedged, or purely descriptive output; no clear conclusion", 3: "Mostly clear and direct; limitations sometimes underplayed", 5: "Consistently sharp, honest, and conclusive; gaps always flagged upfront" }

const EDD_LAYERS = ["Execution", "Project Leader", "Account Leader", "Practice Leader"];

// map 1:1 onto the EDD form's four craft layers (Execution/Project Leader/Account Leader/Practice
// Leader) — this is a judgment-call default. It only pre-fills the layer picker in the competency
// grid; HR/manager can override per review, it is never locked.
const EDD_LAYER_DEFAULT = {
  "Individual": "Execution",
  "Lead": "Project Leader",
  "Manager": "Account Leader",
  "Director": "Practice Leader",
  "C-suite": "Practice Leader"
};

  { v: "other", label: "Other" }
];
const eddAverage = (scores) => {
  const vals = EDD_COMPETENCIES.map(c => Number(scores[c.key])).filter(v => v > 0);
  if (!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
};
const eddScoreColor = (avg) => avg == null ? "text-neutral-400" : avg >= 4 ? "text-emerald-600" : avg >= 3 ? "text-neutral-700" : "text-rose-600";

/* ---- role helpers ----
   HR + CEO + admin see everyone's journey (per the source policy: "HR, CEO to view & keep
   track"). A team_leader / manager sees their own record plus direct reports (via managerId).
   Everyone else — the majority of roles — sees only their own record. */
const EDD_ALL_ACCESS_ROLES = ["admin", "ceo", "hr_manager"];
const eddCanViewAll = (role) => EDD_ALL_ACCESS_ROLES.includes(role);
const eddIsManagerOf = (db, myEmpId, targetEmpId) => {
  const emp = (db.employees || []).find(e => e.id === targetEmpId);
  return !!(emp && myEmpId && emp.managerId === myEmpId);
};
const eddVisibleEmployees = (db, role, myEmpId) => {
  const all = db.employees || [];
  if (eddCanViewAll(role)) return all;
  return all.filter(e => e.id === myEmpId || eddIsManagerOf(db, myEmpId, e.id));
};

function EmployeeDocuments({ db, update, employee, role, myEmpId }) {

  const [docType, setDocType] = useState("contract");
  const [status, setStatus] = useState("idle");
  const upload = async (file) => {
    setStatus("uploading");
    try {
      const path = `employees/${employee.id}/${Date.now()}_${file.name.replace(/[^\w.\-]+/g, "_")}`;
      const url = await sbUploadFile(path, file);
      update(next => {
        const arr = next.employeeDocuments || (next.employeeDocuments = []);
        arr.push({ id: eddNewId("doc"), employeeId: employee.id, docType, title: file.name, fileUrl: url, fileName: file.name, uploadedBy: myEmpId, uploadedAt: Date.now(), notes: "" });
      });
      setStatus("idle");
    } catch (e) { setStatus("error"); }
  };
  const removeDoc = (id) => update(next => { next.employeeDocuments = (next.employeeDocuments || []).filter(d => d.id !== id); });

  return E(Card, { className: "p-5" },
    E("div", { className: "flex items-center justify-between mb-3" },

        E("label", { className: "inline-flex items-center gap-1.5 text-[11px] cursor-pointer bg-neutral-900 text-white rounded-full px-3 py-1.5 hover:bg-neutral-700" },
          E(Icon, { n: "plus", size: 11 }), status === "uploading" ? "Uploading…" : "Upload",
          E("input", {
            type: "file", className: "hidden",
            onChange: (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f) upload(f); }
          }))
      ) : null
    ),
    docs.length === 0 ? E("div", { className: "text-sm text-neutral-400 text-center py-6" }, "No documents yet.") :
      E("div", { className: "divide-y divide-neutral-50" }, docs.map(d => E("div", { key: d.id, className: "flex items-center gap-3 py-2" },
        E(Icon, { n: "file", size: 14, className: "text-neutral-400 shrink-0" }),
        E("a", { href: d.fileUrl, target: "_blank", rel: "noreferrer", className: "flex-1 min-w-0 truncate text-sm underline decoration-neutral-300" }, d.title),

function leaveTier(emp) {
  if (!emp || !emp.level) return null;
  return LEVEL_TIER[String(emp.level).trim().toLowerCase()] || null;
}
function entitlementFor(emp, year) {
  const yearStart = new Date(year, 0, 1),
    yearEnd = new Date(year, 11, 31);
  if (!emp) return {
    tier: null, days: 0, eligible: false, note: "No employee record."
  };
  if (emp.status === "Probation") return {
    tier: leaveTier(emp), days: 0, eligible: false, note: "On probation — Annual Leave Policy applies once probation is completed."
  };
  const tier = leaveTier(emp);
  if (tier === "intern") {
    if (!emp.start) return {
      tier, days: 0, eligible: false, note: "Internship start date missing — cannot calculate (policy: 1 day per month interned). Needs HR input."
    };
    const start = parse(emp.start);
    if (start > yearEnd) return {
      tier, days: 0, eligible: false, note: "Not yet started in " + year + "."
    };
    const from = start > yearStart ? start : yearStart;
    const months = Math.max(0, 12 - from.getMonth());
    return {
      tier, days: months, eligible: true, note: months + " month(s) of internship counted in " + year + " (1 day / month interned)."
    };
  }
  if (!tier) return {
    tier: null, days: 14, eligible: true, note: "Level “" + emp.level + "” isn’t mapped to a policy tier — defaulted to 14d (Execution). Please confirm the correct tier."
  };
  const base = TIER_BASE_DAYS[tier];
  let tenureBonus = 0,
    tenureNote = "";
  if (emp.start) {
    const yrs = (yearEnd - parse(emp.start)) / 31557600000;
    if (yrs >= 4) {
      tenureBonus = 2;
      tenureNote = " + 2 tenure (4y+ service)";
    } else if (yrs >= 2) {
      tenureBonus = 1;
      tenureNote = " + 1 tenure (2y+ service)";
    }
  }
  const fullDays = base + tenureBonus;
  if (!emp.start) return {
    tier, days: fullDays, eligible: true, note: TIER_LABEL[tier] + " base " + base + "d — start date missing, tenure bonus not applied."
  };
  const start = parse(emp.start);
  if (start <= yearStart) return {
    tier, days: fullDays, eligible: true, note: TIER_LABEL[tier] + " base " + base + "d" + tenureNote + "."
  };
  if (start > yearEnd) return {
    tier, days: 0, eligible: false, note: "Starts after " + year + "."
  };
  const monthsWorked = 12 - start.getMonth();
  const proRata = Math.ceil(fullDays * monthsWorked / 12);
  return {
    tier, days: proRata, eligible: true, note: "Pro-rata " + monthsWorked + "/12 months of " + fullDays + "d (joined " + fmtDateY(emp.start) + ")."
  };
}

    const orig = qs[i];

async function sbUpsert(t, rows) {
  if (!rows || !rows.length) return;
  const r = await fetch(`${SB_URL}/rest/v1/${t}`, {
    method: "POST",
    headers: {
      apikey: SB_KEY,
      Authorization: "Bearer " + SB_KEY,
      "Content-Type": "application/json",
      Prefer: "resolution=merge-duplicates,return=minimal"
    },
    body: JSON.stringify(rows)
  });
  if (!r.ok) throw new Error(t + " " + r.status + " " + (await r.text()));
}
async function sbUploadFile(path, file) {
  const r = await fetch(`${SB_URL}/storage/v1/object/contracts/${path}`, {
    method: "POST",
    headers: {
      apikey: SB_KEY,
      Authorization: "Bearer " + SB_KEY,
      "Content-Type": file.type || "application/octet-stream",
      "x-upsert": "true"
    },
    body: file
  });
  if (!r.ok) throw new Error("upload " + r.status);
  return `${SB_URL}/storage/v1/object/public/contracts/${path}`;
}

  if (chg("companyBudgetQuarters")) jobs.push(sbUpsert("company_budget_quarters", (cur.companyBudgetQuarters || []).map(r => ({

    agreed_by_employee: !!r.agreedByEmployee, agreed_by_employee_at: r.agreedByEmployeeAt ? new Date(r.agreedByEmployeeAt).toISOString() : null,
    agreed_by_manager: !!r.agreedByManager, agreed_by_manager_at: r.agreedByManagerAt ? new Date(r.agreedByManagerAt).toISOString() : null,
    status: r.status || "draft", submitted_to_hr_at: r.submittedToHrAt ? new Date(r.submittedToHrAt).toISOString() : null,
    created_by: r.createdBy || null, updated_at: new Date().toISOString()
  }))));
  if (chg("employeeDocuments")) jobs.push(sbUpsert("employee_documents", (cur.employeeDocuments || []).map(d => ({
    id: d.id, employee_id: d.employeeId, doc_type: d.docType || "other", title: d.title,

  }]));
  try {
    await Promise.all(jobs);
  } catch (e) {
    console.warn("persist failed:", e.message);
  }
}

      } catch (e) {}
    }

  });

  const applyRemote = d => {
    skipRef.current = true;
    setDb(d);
  };
  useEffect(() => {
    let on = true;
    loadFromSB().then(d => {
      if (on && d) {
        applyRemote(d);
        setSbState("live");
      } else if (on) {
        setSbState("local");
      }
    });
    return () => {
      on = false;
    };
  }, []);
  useEffect(() => {
    if (skipRef.current) {
      skipRef.current = false;

      return;
    }
