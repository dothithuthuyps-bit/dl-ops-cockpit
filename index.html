/* ---------- approval chain (value-based) ---------- */
function chainFor(amount, threshold) {
  const base = ["team_leader", "accountant", "finance_director"];
  return amount > threshold ? [...base, "ceo"] : base;
}
function chainState(req, db) {
  const th = db.settings && db.settings.approvalThreshold || DEFAULT_THRESHOLD;
  const chain = chainFor(req.amount, th);
  const logs = db.audit.filter(a => a.requestId === req.id);
  if (logs.some(a => a.action === "rejected")) return {
    chain,
    nextRole: null,
    rejected: true,
    complete: false,
    approvedRoles: []
  };
  const approvedRoles = logs.filter(a => a.action === "approved").map(a => a.role);
  const nextRole = chain.find(r => !approvedRoles.includes(r));
  return {
    chain,
    approvedRoles,
    nextRole,
    complete: !nextRole,
    rejected: false
  };
}

async function sbUpsert(t, rows) {

  const r = await fetch(`${SB_URL}/rest/v1/${t}`, {
    method: "POST",
    headers: {
      apikey: SB_KEY,
      Authorization: "Bearer " + SB_KEY,
      "Content-Type": "application/json",
      Prefer: "resolution=merge-duplicates,return=minimal"
    },
    body: JSON.stringify(rows)
  });
  if (!r.ok) throw new Error(t + " " + r.status + " " + (await r.text()));
}

      "Content-Type": file.type || "application/octet-stream",
      "x-upsert": "true"
    },

  });

  if (chg("candidates")) jobs.push(sbUpsert("candidates", cur.candidates.map(candSB)));
  if (chg("assets")) jobs.push(sbUpsert("assets", cur.assets.map(assetSB)));
  if (chg("adminTasks")) jobs.push(sbUpsert("admin_tasks", cur.adminTasks.map(taskSB)));
  if (chg("vendors")) jobs.push(sbUpsert("vendors", cur.vendors.map(vendSB)));
  if (chg("finSnapshots")) jobs.push(sbUpsert("fin_snapshots", cur.finSnapshots));
  if (chg("actionItems")) jobs.push(sbUpsert("action_items", cur.actionItems.map(a => ({
    ...a,
    updated_at: new Date().toISOString()
  }))));

  }]));

    await Promise.all(jobs);
  } catch (e) {
    console.warn("persist failed:", e.message);
  }
}
